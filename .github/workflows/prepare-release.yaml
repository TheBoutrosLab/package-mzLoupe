---
name: 📦 Prepare new release

run-name: Open PR for new ${{ inputs.bump_type }} release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        type: choice
        description: Semantic version bump type
        required: true
        options:
          - major
          - minor
          - patch
      prerelease:
        type: boolean
        description: Create a prerelease

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest

    # Use the lab's release tools directly so frontend synchronization happens
    # before the release PR is created. The reusable workflow has no step hook.
    defaults:
      run:
        working-directory: caller

    env:
      BUMP_TYPE: ${{ inputs.bump_type }}
      PRERELEASE: ${{ inputs.prerelease }}
      # Required by the lab release tools, even for semantic version bumps.
      EXACT_VERSION: ""
      CHANGELOG_TIMEZONE: America/Los_Angeles

    steps:
      - name: Checkout release tools
        uses: actions/checkout@v7
        with:
          repository: TheBoutrosLab/tool-create-release
          ref: v1
          path: release-tools
          token: ${{ secrets.BL_SBP_REPO_READ_TOKEN_YP }}

      - name: Checkout mzLoupe
        uses: actions/checkout@v7
        with:
          path: caller
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install release tools
        run: python -m pip install ../release-tools

      - name: Determine release version
        id: get-next-version
        run: get-next-version "$PWD" "$BUMP_TYPE" "$PRERELEASE" "$EXACT_VERSION"

      - name: Update the Python release version
        run: bump-version-files "$PWD" "$VERSION" "pyproject.toml"
        env:
          VERSION: ${{ steps.get-next-version.outputs.next_version }}

      - name: Synchronize frontend versions
        run: python .github/scripts/sync_versions.py

      - name: Check package versions
        run: python .github/scripts/sync_versions.py --check

      - name: Update the changelog
        id: bump-changelog
        run: bump-changelog "CHANGELOG.md" "$REPO_URL" "$VERSION"
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          VERSION: ${{ steps.get-next-version.outputs.next_version }}

      - name: Create release pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.BL_SBP_REPO_READ_TOKEN_YP }}
          path: caller
          add-paths: |
            CHANGELOG.md
            pyproject.toml
            web/package.json
            web/package-lock.json
          commit-message: Prepare version ${{ steps.get-next-version.outputs.next_version }}
          title: ${{ steps.bump-changelog.outputs.pr_title }}
          body-path: ${{ steps.bump-changelog.outputs.pr_bodyfile }}
          branch: ${{ steps.get-next-version.outputs.branch_name }}
