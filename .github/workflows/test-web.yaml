---
name: Web tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  frontend:
    name: Web tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      MZLOUPE_TEST_ARTIFACTS: ${{ github.workspace }}/test-results/frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Python for the API integration test
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Python dependencies
        working-directory: .
        run: python -m pip install -e '.[dev]'

      - name: Install Chromium and Linux browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Run unit tests, build, and browser tests
        run: npm test

      - name: Upload browser screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-browser-screenshots
          path: test-results/frontend
          if-no-files-found: ignore
          retention-days: 7
