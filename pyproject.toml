[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mzloupe"
description = "A local browser dashboard for mass spectrometry evidence."
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
version = "0.1.0"
readme = "README.md"
maintainers = [{name = "Boutros Lab"}]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pyopenms>=3.6,<4",
    "numpy>=2,<3",
    "filelock>=3.16,<4",
]

[project.urls]
"Homepage" = "https://github.com/TheBoutrosLab/package-mzLoupe"
"Bug Tracker" = "https://github.com/TheBoutrosLab/package-mzLoupe/issues"
"Repository" = "https://github.com/TheBoutrosLab/package-mzLoupe.git"
"Changelog" = "https://github.com/TheBoutrosLab/package-mzLoupe/blob/main/CHANGELOG.md"

[project.scripts]
mzloupe = "mzloupe.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "build",
    "hatchling",
    "pylint>=4.1,<5",
    "pyright>=1.1,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["mzloupe"]
artifacts = ["mzloupe/static/**"]

[tool.hatch.build.targets.sdist]
include = [
    "/mzloupe",
    "/web/src",
    "/web/scripts",
    "/web/licenses",
    "/web/package.json",
    "/web/package-lock.json",
    "/web/vite.config.ts",
    "/web/tsconfig.json",
    "/web/index.html",
    "/test",
    "/.github/scripts",
    "/README.md",
    "/docs/*.md",
    "/docs/assets/logo/mzloupe-logo-on-light.svg",
    "/docs/assets/logo/mzloupe-logo-on-navy.svg",
    "/CHANGELOG.md",
    "/LICENSE",
    "/.pylintrc",
    "/CONTRIBUTING.md",
]
artifacts = ["mzloupe/static/**"]

[tool.pytest.ini_options]
testpaths = ["test/python"]
addopts = "--import-mode=importlib"

[tool.tox]
legacy_tox_ini = """
[tox]
env_list = py3.11, py3.12
[testenv]
deps = pytest
       httpx
commands = pytest test/python --junitxml=junit/test-results.xml
"""
